version: "3.8"

services:
  backend:
    build: ./backend
    container_name: quack2-backend
    ports:
      - "8080:8080"
    networks:
      - quack2-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  frontend:
    build: ./frontend
    container_name: quack2-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://backend:8080/ws
    networks:
      - quack2-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  quack2-net:
    driver: bridge
